name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiniRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiniRemote-apk
          path: MiniRemote.apk
      - name: Publish as the latest release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build MiniRemote.apk \
            --title "Latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Install on Android (allow unknown apps)."
