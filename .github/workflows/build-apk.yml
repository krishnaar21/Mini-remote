name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2
      - name: Set up the stable signing key
        # Same key every build, so a new APK installs over the old one without uninstalling.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mini-remote.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/mini-remote.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is missing, so this APK uses a throwaway key and won't install over earlier builds."
          fi
      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiniRemote.apk
          # The in-app updater reads this to find newer builds and verify the download.
          printf '{"versionCode":%s,"versionName":"0.2.%s","sha256":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$(sha256sum MiniRemote.apk | cut -d' ' -f1)" > version.json
          cat version.json
      - uses: actions/upload-artifact@v5
        with:
          name: MiniRemote-apk
          path: |
            MiniRemote.apk
            version.json
      - name: Publish as the latest release (stable download link)
        # Only builds of main replace the public download; PR builds stay as run artifacts.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build MiniRemote.apk version.json \
            --title "Latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Install on Android (allow unknown apps)."
