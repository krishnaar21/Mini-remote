name: Android screenshots
on:
  push:
    branches: [claude/project-thread-vxzntz]
    paths: ["app/**", ".github/workflows/android-screens.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2
      - name: Set up the stable signing key
        # Same key as the main build, so this APK installs over the one on the phone.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mini-remote.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/mini-remote.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/android-shots.sh
        timeout-minutes: 30
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-screenshots
          path: shots
      - name: Publish screenshots to the android-screenshots branch
        if: always() && hashFiles('shots/*.png') != ''
        run: |
          cd shots
          git init -q -b android-screenshots
          git -c user.name="github-actions[bot]" -c user.email=41898282+github-actions[bot]@users.noreply.github.com add -A
          git -c user.name="github-actions[bot]" -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Android screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screenshots
