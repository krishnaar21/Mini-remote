name: MiniRemote
options:
  bundleIdPrefix: com.krishna
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MiniRemote:
    type: application
    platform: iOS
    sources: [MiniRemote]
    info:
      path: MiniRemote/Info.plist
      properties:
        CFBundleDisplayName: Mini Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Voice mode in Search, and holding OK to talk to your TV, use the microphone only while listening.
        NSSpeechRecognitionUsageDescription: Your words are turned into text (on this iPhone where possible) and typed on your TV.
        NSLocalNetworkUsageDescription: Mini Remote finds and controls the TVs on your Wi-Fi. It only talks to devices on your own network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishna.miniremote
        GENERATE_INFOPLIST_FILE: NO
